name: 🐞 Bug report
description: Report a problem with an icon, the webfont, sprite, or the package.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Import '...'
        2. Render icon '...'
        3. See '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: Which integration option is affected?
      options:
        - SVG sprite
        - Webfont (WOFF2/WOFF/TTF)
        - PNG
        - JS/TS constants
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: weather-iconic version
      placeholder: e.g. 2.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser / bundler / framework, if relevant.
      placeholder: e.g. Chrome 126, Vite 7, React 18
    validations:
      required: false
